# Temporary first-certificate configuration. Remove it after Certbot succeeds,
# then enable wz6688.app.conf. It never proxies application traffic over HTTP.
log_format wangzhe_bootstrap_safe escape=json '{"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr","host":"$host",'
  '"method":"$request_method","uri":"$uri","status":$status}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_bootstrap_safe;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name wz6688.app admin.wz6688.app;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_bootstrap_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
