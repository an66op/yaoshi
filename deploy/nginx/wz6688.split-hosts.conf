    }
    location = /api/admin/activities/upload {
        client_max_body_size 9m;
        limit_req zone=wz_current_api burst=5 nodelay;
        proxy_pass http://wz_current_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        limit_req zone=wz_current_api burst=60 nodelay;
        proxy_pass http://wz_current_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location = /index.html { expires -1; etag off; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
