# Install snippets under /etc/nginx/snippets, this file under
# /etc/nginx/sites-available, and disable the distribution's default site.
limit_req_zone $binary_remote_addr zone=wangzhe_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=wangzhe_conn:10m;
# Never log $request or $args: the one-time WebSocket ticket is carried in
# /api/ws?ticket=... and must not enter Nginx access logs.
log_format wangzhe_safe escape=json '{"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr","host":"$host",'
  '"method":"$request_method","uri":"$uri","protocol":"$server_protocol",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"request_id":"$request_id"}';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wangzhe_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Reject unknown Host/SNI values instead of letting the first business vhost
# become an accidental default site. The distribution default site must be
# disabled before enabling this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_safe;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_safe;
    ssl_certificate /etc/letsencrypt/live/wz6688.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wz6688.app/privkey.pem;
    include /etc/nginx/snippets/wangzhe-tls.conf;
    return 444;
}

# HTTP exists only for ACME renewal and a fixed-host HTTPS redirect. Using a
# fixed hostname avoids reflecting an attacker-controlled Host header.
server {
    listen 80;
    listen [::]:80;
    server_name wz6688.app;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://wz6688.app$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.wz6688.app;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://www.wz6688.app$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.wz888.site;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://admin.wz888.site$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wz6688.app www.wz6688.app;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_safe;
    root /opt/wangzhe/current/member;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/wz6688.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wz6688.app/privkey.pem;
    include /etc/nginx/snippets/wangzhe-tls.conf;
    include /etc/nginx/snippets/wangzhe-security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss://wz6688.app wss://www.wz6688.app; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_conn wangzhe_conn 40;
    limit_req_status 429;
    if (-f /etc/wangzhe/maintenance) { return 503; }

    location = /api/ws {
        proxy_pass http://wangzhe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        # Nginx error messages can include the raw request line. The backend
        # retains WebSocket diagnostics without writing the ticket to disk.
        error_log /dev/null crit;
        limit_conn wangzhe_conn 8;
        limit_req zone=wangzhe_api burst=20 nodelay;
    }

    # Privileged control-plane APIs are available only on the admin hostname.
    location ^~ /api/admin/ { return 404; }
    location ^~ /api/tenant/ { return 404; }
    location ^~ /api/agent/ { return 404; }

    location /api/ {
        limit_req zone=wangzhe_api burst=60 nodelay;
        include /etc/nginx/snippets/wangzhe-proxy.conf;
    }

    location = /index.html {
        expires -1;
        etag off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.wz888.site;
    access_log /var/log/nginx/wangzhe-access.log wangzhe_safe;
    root /opt/wangzhe/current/admin;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/admin.wz888.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.wz888.site/privkey.pem;
    include /etc/nginx/snippets/wangzhe-tls.conf;
    include /etc/nginx/snippets/wangzhe-security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://wz6688.app https://www.wz6688.app; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss://admin.wz888.site; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_conn wangzhe_conn 40;
    limit_req_status 429;
    if (-f /etc/wangzhe/maintenance) { return 503; }

    location = /api/ws {
        proxy_pass http://wangzhe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        error_log /dev/null crit;
        limit_conn wangzhe_conn 8;
        limit_req zone=wangzhe_api burst=20 nodelay;
    }

    location = /api/admin/activities/upload {
        client_max_body_size 9m;
        client_body_timeout 30s;
        limit_req zone=wangzhe_api burst=5 nodelay;
        include /etc/nginx/snippets/wangzhe-proxy.conf;
    }

    location /api/ {
        limit_req zone=wangzhe_api burst=60 nodelay;
        include /etc/nginx/snippets/wangzhe-proxy.conf;
    }

    location = /index.html {
        expires -1;
        etag off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
