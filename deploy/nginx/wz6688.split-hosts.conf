# Existing certificate/DNS installation: apex is member, www is management.
# Keep the standard admin.wz6688.app template for hosts with that DNS configured.
limit_req_zone $binary_remote_addr zone=wz_current_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=wz_current_conn:10m;
log_format wz_current_safe escape=json '{"time":"$time_iso8601","host":"$host","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time}';
map $http_upgrade $wz_current_upgrade { default upgrade; '' close; }
upstream wz_current_backend { server 127.0.0.1:8080; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name wz6688.app;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    location / { return 308 https://wz6688.app$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name www.wz6688.app;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    location / { return 308 https://www.wz6688.app$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wz6688.app;
    root /opt/wangzhe/current/member;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/wz6688.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wz6688.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WZCURRENT:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss://wz6688.app; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    access_log /var/log/nginx/wangzhe-access.log wz_current_safe;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_conn wz_current_conn 40;
    limit_req_status 429;
    if (-f /etc/wangzhe/maintenance) { return 503; }
    # Test-site opt-in only. No credentials are bundled in either frontend.
    location = /test-login.json {
        if (!-f /etc/wangzhe/test-login.enabled) { return 404; }
        alias /etc/wangzhe/test-login/member.json;
        default_type application/json;
        etag off;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        access_log off;
    }
    location = /api/ws {
        proxy_pass http://wz_current_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wz_current_upgrade;
        proxy_read_timeout 75s;
        proxy_buffering off;
        error_log /dev/null crit;
        limit_conn wz_current_conn 8;
        limit_req zone=wz_current_api burst=20 nodelay;
    }
    location ^~ /api/admin/ { return 404; }
    location ^~ /api/tenant/ { return 404; }
    location ^~ /api/agent/ { return 404; }
    location /api/ {
        limit_req zone=wz_current_api burst=60 nodelay;
        proxy_pass http://wz_current_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location = /index.html { expires -1; etag off; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wz6688.app;
    root /opt/wangzhe/current/admin;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/wz6688.app/fullchain.pem;
